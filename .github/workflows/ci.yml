name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Test, typecheck, lint, bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Core unit tests (incl. puzzle-validator QA gate)
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Bundle shared core for Edge Functions (Deno)
        run: npm run build:edge-core

      - name: Verify edge core bundle is committed and up to date
        run: git diff --exit-code -- supabase/functions/_shared/core.mjs
